name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: carehub
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: carehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carehub -d carehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://carehub@127.0.0.1:5432/carehub
      APP_ENV: ci
      PYTHONPATH: 02_conteneurisation/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 02_conteneurisation/app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 02_conteneurisation/app/requirements.txt
          pip install pytest==8.3.5 pytest-cov==6.1.1 ruff==0.11.13
      - name: Lint
        run: ruff check 02_conteneurisation/app
      - name: Tests + coverage gate
        run: >-
          pytest 02_conteneurisation/app/tests
          --cov=main
          --cov-report=term-missing
          --cov-fail-under=70

  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit==4.2.0
      - run: pre-commit run --all-files
