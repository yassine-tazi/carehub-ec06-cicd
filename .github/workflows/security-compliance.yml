name: Security and compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_failure:
        description: 'For evidence only: run the custom compliance gate on the intentionally non-compliant test file'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Custom infrastructure compliance gate — normal
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.demo_failure == false }}
        run: python 01_pipeline/scripts/check_compliance.py 02_conteneurisation/compose.yml
      - name: Custom infrastructure compliance gate — intentional evidence failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_failure == true }}
        run: python 01_pipeline/scripts/check_compliance.py 01_pipeline/testdata/noncompliant.compose.yml

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem / IaC / secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
