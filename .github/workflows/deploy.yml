name: Deploy validation

on:
  workflow_run:
    workflows: ['Build, scan, publish and sign']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy-validation:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create ephemeral deployment environment
        working-directory: 02_conteneurisation
        shell: bash
        run: |
          cat > .env.ci <<EOF
          APP_IMAGE=ghcr.io/${{ github.repository_owner }}/carehub:${{ steps.version.outputs.sha }}
          POSTGRES_DB=carehub
          POSTGRES_USER=carehub
          POSTGRES_PASSWORD=ci-demo-password
          APP_ENV=production
          APP_PORT=8080
          EOF

      - name: Deploy stack with 3 application replicas
        working-directory: 02_conteneurisation
        shell: bash
        run: |
          docker compose \
            --env-file .env.ci \
            -f compose.yml \
            -f compose.prod.yml \
            up -d --scale app=3

      - name: Show deployed containers
        working-directory: 02_conteneurisation
        run: |
          docker compose \
            --env-file .env.ci \
            -f compose.yml \
            -f compose.prod.yml \
            ps

      - name: Post-deployment smoke test
        shell: bash
        run: |
          for i in $(seq 1 18); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo
              echo "DEPLOYMENT VALIDATION: SUCCESS"
              exit 0
            fi

            echo "Waiting for CareHub..."
            sleep 5
          done

          echo "DEPLOYMENT VALIDATION: FAILED"
          exit 1

      - name: Load-balancing evidence
        shell: bash
        run: |
          for i in $(seq 1 12); do
            curl -fsS http://127.0.0.1:8080/instance
            echo
          done

      - name: Resource usage
        run: docker stats --no-stream

      - name: Cleanup
        if: always()
        working-directory: 02_conteneurisation
        run: |
          docker compose \
            --env-file .env.ci \
            -f compose.yml \
            -f compose.prod.yml \
            down -v