name: Build, scan, publish and sign

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/carehub

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.image.outputs.full }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image name
        id: image
        shell: bash
        run: echo "full=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: 02_conteneurisation
          file: 02_conteneurisation/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.full }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Scan published image - blocking HIGH and CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.full }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with OIDC keyless
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ steps.image.outputs.full }}@${{ steps.build.outputs.digest }}"