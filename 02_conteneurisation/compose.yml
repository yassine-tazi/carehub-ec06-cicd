services:
  db:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carehub}
      POSTGRES_USER: ${POSTGRES_USER:-carehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - carehub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carehub} -d ${POSTGRES_DB:-carehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "0.75"
    mem_limit: 768m
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:-carehub-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-carehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carehub}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    cpus: "0.50"
    mem_limit: 384m
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27.4-alpine3.21
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    cpus: "0.25"
    mem_limit: 128m
    networks: [frontend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  carehub_db_data:
    name: carehub_db_data

networks:
  frontend:
    name: carehub_frontend
    driver: bridge
  backend:
    name: carehub_backend
    driver: bridge
    internal: true
